name: Viewer checks
on:
  push:
    branches: [main, codex/red-hill-viewer-upgrade]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: viewer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-browser-evidence
          path: |
            playwright-report/
            test-results/
            package-lock.json
          retention-days: 14
